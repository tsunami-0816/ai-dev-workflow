name: tests

on:
  push:
    paths:
      - "08_测试/qa-automation/**"
      - "05_代码/backend/**"
      - "05_代码/cloud-functions/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "08_测试/qa-automation/**"
      - "05_代码/backend/**"
      - "05_代码/cloud-functions/**"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install -r 08_测试/qa-automation/requirements.txt
      - name: Pytest collect-only (syntax + discovery, no services required)
        working-directory: 08_测试/qa-automation
        run: pytest --collect-only -q
      - name: OpenAPI contract shape
        working-directory: 08_测试/qa-automation
        run: pytest testcases/l1_unit/test_pure_utils.py::test_openapi_contract_shape -q

  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Backend JUnit (PasswordHasher / JwtService)
        working-directory: 05_代码/backend/booking-service
        run: mvn -q -Dtest=PasswordHasherTest,JwtServiceTest test
