[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-cli"
version = "0.1.0"
description = "从 0 到 1 项目自动工作流命令行工具（wf）：项目脚手架、进度看板、提示词调度、机器校验、失败日志"
readme = "README_使用说明.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
wf = "workflow_cli.cli:main"

[tool.setuptools]
packages = ["workflow_cli"]
