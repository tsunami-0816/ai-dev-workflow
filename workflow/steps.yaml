# 工作流步骤单一清单（单一事实源）
# 谁读它：scripts/workflow_completion_check.py（门禁检查项）、workflow_cli/cli.py（wf next / wf prompt / wf steps --check）
# 改步骤只改这里；WORKFLOW_步骤定义.md 表格与看板模板用于人读，由 `wf steps --check` 校验是否对得上。
# owner：agent = AI 自跑 | human = 人工卡点 | machine = 脚本自动

version: 1

# 问题台账（第 6/6.5/7/8/8.5/9 步共用的唯一问题清单）
# 门禁读它：存在 open/fixed 的 P0/P1 → 阻塞放行。
# 文件不存在时视为历史项目（门禁上线前完成），不阻塞。
ledger:
  path: _问题台账.md
  block_levels: ["P0", "P1"]
  block_states: ["open", "fixed"]
  fallback: ["7", "8", "9"]

# 设计→实施 100% 映射表（第 4 步建表，5A/5B/6/7/8/9 逐行更新，10.0 门禁卡 100%）
# 门禁读它：scripts/design_impl_check.py；2026-10-31 起创建的项目必须有该表
mapping:
  path: _设计实施映射表.md
  launch_date: "2026-10-31"
  fallback: ["4", "5A", "5B", "6"]
  # 10.0 门禁：映射表少于 10 行直接判结构不完整（防 1 行表冒充 100%）
  min_rows: 10
  # G8 指标挂接核对（criterion 100% 挂接）：当前旁路观察期，check_project 缺省 strict_criterion=false；
  # 连续一个项目无误报后转阻塞闸（脚本加 --strict-criterion / completion_check 传 true）。

# 设计模块 0.1~0.5：不在 steps 列表里（它没有项目看板，走 projects/_队列/），
# 但提示词必须存在，由 `wf steps --check` 与 WORKFLOW_步骤定义.md 双向校验。
design_module:
  - id: "0.1"
    name: JD 结构化拆解
    prompt: step00_1_拆解JD.md
  - id: "0.2"
    name: 作品集画像扫描
    prompt: step00_2_建画像库.md
  - id: "0.3"
    name: 缺口分析
    prompt: null
  - id: "0.4"
    name: 候选选题矩阵
    prompt: step00_3_选题设计.md
  - id: "0.5"
    name: 一页纸项目设计书
    prompt: null

steps:
  - id: "1"
    name: 项目基线定义
    owner: agent
    prompt: step01_项目基线定义.md
    fallback: ["1"]
    # G1 输入卡（typed handoff）；校验脚本 scripts/input_card_check.py，历史项目豁免
    input_card: 01_项目基线说明书.md.input_card.yaml
    artifacts: []

  - id: "2"
    name: 技术架构设计
    owner: agent
    prompt: step02_技术架构设计.md
    fallback: ["1", "2"]
    input_card: 02_架构设计/input_card.yaml
    artifacts: []

  - id: "3"
    name: 架构评审卡点
    owner: human
    prompt: step03_架构评审卡点.md
    fallback: ["1", "2", "3"]
    artifacts: []

  - id: "4"
    name: 任务拆解与开发规范
    # 2026-10-30 R20：扫漏由人工对照清单降级为机器闸门（关键词扫描，缺类自动补齐，补不出才叫人）
    owner: agent
    prompt: step04_任务拆解与开发规范.md
    fallback: ["3", "4"]
    input_card: 04_任务拆解与开发规范.md.input_card.yaml
    artifacts: []

  - id: "5A"
    name: 后端开发
    owner: agent
    prompt: step05A_后端开发.md
    fallback: ["4", "5A"]
    input_card: 05_代码/backend/input_card.yaml
    artifacts: []

  - id: "5B"
    name: 前端开发
    owner: agent
    prompt: step05B_前端开发.md
    fallback: ["4", "5A", "5B"]
    input_card: 05_代码/frontend/input_card.yaml
    artifacts:
      # 精修模式下才有（R24）；普通模式不查
      - path: 05_代码/frontend/设计精修记录.md
        label: step5B 设计精修记录（精修模式下）
        keywords: ["设计精修", "第 1 轮", "最终检测结果"]
        forbid: ["结论：不通过", "结论: 不通过", "未达标", "待补", "TODO"]
        launch_date: "2026-11-04"
        # optional + mode：看板「设计模式」不含“精修”时跳过，不判红也不要求交占位文件
        optional: true
        mode: "精修"

  - id: "5.5"
    name: 独立代码 Review（写实现者不得自审）
    # 2026-11-01 采纳极海团队「AI 写 · AI 审 · 人定规则」：另起 reviewer、新上下文、只审不改
    owner: agent
    prompt: step05_5_代码独立review.md
    fallback: ["5A", "5B", "5.5"]
    artifacts:
      - path: 05.5_代码Review/代码Review报告.md
        label: step5.5 独立代码 Review 报告
        keywords: ["需求正确性", "系统一致性", "回归", "结论"]
        forbid: ["结论：不通过", "Review 未通过", "未达标", "待补", "TODO"]
        # 上线日：此前创建的项目视为历史项目，不因缺这份新增产物被判红
        launch_date: "2026-11-01"
        min_bytes: 500

  - id: "6"
    name: 本地真实运行与冒烟
    owner: human
    prompt: step06_本地运行与冒烟.md
    fallback: ["5A", "5B", "6"]
    input_card: 06_冒烟/input_card.yaml
    artifacts:
      - path: 06_冒烟/冒烟记录.md
        label: step6 本地冒烟记录
        keywords: ["冒烟", "主流程", "探活", "启动"]
        forbid: ["主流程未通", "结论：不通过", "未达标", "待补", "TODO"]
        min_bytes: 200
      - path: 06_冒烟/前端UI质量报告.md
        label: step6 前端 UI 质量检测报告（R23）
        keywords: ["error", "warning", "advisory", "对比度"]
        forbid: ["未检测", "脚本异常", "待补", "TODO"]
        launch_date: "2026-11-04"
        min_bytes: 60
        # #98 纯后端无前端项目自动跳过；仍可补「不适用登记占位」留痕
        requires_frontend: true
      - path: 06_冒烟/taste审美检测报告.md
        label: step6 taste 审美检测报告（R23 配套 taste 子项）
        keywords: ["FAIL", "taste", "inspect", "对比度"]
        forbid: ["未检测", "脚本异常", "待补", "TODO"]
        launch_date: "2026-11-05"
        min_bytes: 60
        # #98 纯后端无前端项目自动跳过
        requires_frontend: true

  - id: "6.5"
    name: 接口契约校验
    owner: machine
    prompt: null
    fallback: ["6.5"]
    artifacts:
      - path: 06.5_契约/openapi.json
        label: step6.5 接口契约（OpenAPI 导出）
        keywords: []
        min_bytes: 100
        # #98 纯后端/私有二进制协议（Protobuf/KCP 等）无 HTTP 路由可导出 OpenAPI，自动跳过；契约载体见契约校验记录
        requires_frontend: true
      - path: 06.5_契约/契约校验记录.md
        label: step6.5 契约校验结果记录
        keywords: ["通过", "PASS", "0 个臆造", "无臆造", "一致"]
        forbid: ["校验未通过", "契约未通过", "结论：不通过", "未通过", "不通过"]
        min_bytes: 80

  - id: "7"
    name: 全链路联调验证
    owner: agent
    prompt: step07_全链路联调.md
    fallback: ["7"]
    input_card: 07_联调/input_card.yaml
    artifacts:
      # 问题记入 _问题台账.md，回归结论写回台账状态（不再单独产回归报告）
      - path: 07_联调/联调检查清单.md
        alt: ["07_联调/联调问题清单.md"]
        label: step7 联调检查清单（问题记入 _问题台账.md）
        keywords: ["链路", "联调", "检查"]
        forbid: ["联调未通过", "结论：不通过", "待补", "TODO"]
        min_bytes: 200

  - id: "7.5"
    name: 测试数据重置与干净交接
    owner: agent
    prompt: null
    fallback: ["7.5"]
    artifacts:
      - path: 07_联调/数据重置记录.md
        label: step7.5 测试数据重置记录
        keywords: ["重置", "清理", "种子数据", "干净"]
        forbid: ["未重置", "重置失败", "待补", "TODO"]
        min_bytes: 100

  - id: "8"
    name: 第一轮全量测试
    owner: agent
    prompt: step08_全量测试.md
    fallback: ["8"]
    input_card: 08_测试/input_card.yaml
    artifacts:
      - path: 08_测试/p0_cases.json
        label: step8 P0 用例沉淀
        keywords: []
        min_bytes: 50
      - path: 08_测试/基线指标验证表.md
        label: step8 基线量化指标验证归属表
        keywords: ["M1", "M2", "指标", "验证"]
        forbid: ["未达标", "未验收", "待补", "TODO"]
        min_bytes: 200

  - id: "8.5"
    name: 安全扫描与渗透检查
    owner: human
    prompt: step08_5_安全扫描.md
    fallback: ["8.5"]
    artifacts:
      - path: 08.5_安全扫描/docs/安全扫描报告.md
        label: step8.5 安全扫描报告
        keywords: ["P0", "P1", "清零"]
        # 防“否定式通过”：只禁结论性否定，不误伤“未修复前阻塞验收”这类流程说明
        forbid: ["P0 未清零", "P1 未清零", "安全未通过", "结论：不通过", "仍存在 P0", "仍存在 P1"]
        min_bytes: 300

  - id: "9"
    name: 最终验收测试
    owner: human
    prompt: step09_最终验收.md
    fallback: ["9"]
    input_card: 09_验收/input_card.yaml
    artifacts:
      - path: 09_验收/最终验收清单与报告.md
        label: step9 最终验收报告
        keywords: ["验收", "通过", "上线"]
        forbid: ["验收不通过", "结论：不通过", "未验收"]
        min_bytes: 200

  - id: "10"
    name: 上线交付与复盘
    owner: agent
    prompt: step10_交付复盘.md
    fallback: ["10"]
    input_card: 10_交付/input_card.yaml
    artifacts:
      - path: 10_交付/交付复盘.md
        label: step10 交付复盘报告
        keywords: ["复盘", "归因", "踩坑"]
        forbid: ["待补", "TODO"]
        min_bytes: 400
      - path: 10_交付/交付包与上线方案.md
        label: step10 交付包与上线方案（含 10.7 环境收尾留证）
        keywords: ["交付", "上线", "环境收尾"]
        forbid: ["待补", "TODO"]
        min_bytes: 300
        # 2026-11-08 起新增：此前完成的项目不补造，不判红
        launch_date: "2026-11-09"

  - id: "10.0"
    name: 完成门禁（机器卡点）
    owner: machine
    prompt: null
    fallback: ["10"]
    artifacts: []

  - id: "10.5"
    name: GitHub 推送
    owner: agent
    prompt: null
    fallback: ["10.5"]
    artifacts: []

  - id: "10.6"
    name: 简历适配产出
    owner: agent
    prompt: step10_简历适配.md
    fallback: ["10.6"]
    # 不入门禁：历史项目（门禁上线前完成）没有这两份产物，硬查会把它们判红
    artifacts: []

  - id: "11"
    name: 工作流自迭代
    owner: human
    prompt: step11_工作流自迭代.md
    fallback: ["11"]
    artifacts: []

# ---------- 翻新线步骤（F0~F4） ----------
# 定位与设计见 WORKFLOW_翻新线设计.md；WORKFLOW_步骤定义.md 同步有翻新线步骤表
# owner：agent = AI 自跑 | human = 人工卡点 | machine = 脚本自动
# 翻新线 owner 标记沿用生产线口径；卡点 R-1/R-2 为人工卡点

  - id: "F0"
    name: 迁入建档
    # 野生入口：复制源目录（含 .git）+ 写看板翻新字段；毕业生入口：仅补看板字段
    owner: machine
    prompt: null
    fallback: ["F0"]
    artifacts:
      # 翻新线看板字段（路线=翻新、源路径、远程仓库 URL、git 基线 commit）——门禁脚本按看板「路线=翻新」额外查这三项非空
      - path: _项目状态.md
        label: F0 翻新线看板字段（路线 + 源路径 + remote URL + git 基线）
        keywords: ["路线=翻新", "远程仓库", "git 基线"]
        forbid: ["未迁入", "未闭环", "结论：不通过", "结论: 不通过"]
        launch_date: "2026-11-02"

  - id: "F1"
    name: 逆向建档（仅野生）
    # 毕业生入口跳过 F1；闸门：顶层模块/服务清单 vs 代码目录一一对应
    owner: agent
    prompt: null
    fallback: ["F0", "F1"]
    artifacts:
      - path: 00_原始项目描述.md
        label: F1 逆向原始描述（标注「逆向自代码」）
        keywords: ["逆向自代码", "逆向"]
        forbid: ["待补", "TODO", "未达标", "结论：不通过"]
      - path: 00_项目设计书.md
        label: F1 逆向项目设计书
        keywords: ["逆向", "顶层模块"]
        forbid: ["待补", "TODO", "未达标", "结论：不通过"]
      - path: 01_项目基线说明书.md
        label: F1 逆向项目基线（量化指标标「实测」或「待拍板」）
        keywords: ["实测", "待拍板", "逆向"]
        forbid: ["待补", "TODO", "未达标", "结论：不通过"]

  - id: "F2"
    name: 九维度体检
    # 体检报告落盘 F2_体检/；台账+失败日志初始化
    # 2026-11-04 新增第 9 维度「前端 UI 质量」（R23）
    owner: agent
    prompt: null
    fallback: ["F0", "F1", "F2"]
    artifacts:
      - path: F2_体检/体检报告.md
        label: F2 九维度体检报告（可运行性/映射/契约/安全/测试/产物/文档/链路追踪/UI质量）
        keywords: ["可运行性", "体检报告", "九维度", "P0", "P1"]
        forbid: ["未体检", "结论：不通过", "待补", "TODO"]
        launch_date: "2026-11-02"
        min_bytes: 500
      - path: F2_体检/前端UI质量报告.md
        label: F2 前端 UI 质量检测报告（R23）
        keywords: ["error", "warning", "advisory", "对比度"]
        forbid: ["未检测", "脚本异常", "待补", "TODO"]
        launch_date: "2026-11-04"
        min_bytes: 60

  - id: "F3"
    name: 返修
    # 台账清单上的问题全部修复 + 强制走生产线 5.5→6→6.5→7→7.5→8→8.5→9 全序列
    # owner=agent 因为返修本身靠 AI；但中间经过的生产线步骤各自卡点照常
    owner: agent
    prompt: null
    fallback: ["F2", "F3"]
    artifacts: []

  - id: "F4"
    name: 交付
    # = 生产线 step10→10.0→10.5→10.6→11 原样；10.6 简历材料加「翻新前后对比」段
    owner: agent
    prompt: null
    fallback: ["F3", "F4"]
    artifacts: []
